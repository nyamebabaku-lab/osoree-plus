name: Build iPhone app

on:
  push:
    branches: [main, ios-dev]
  workflow_dispatch:

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app and the iPhone project
        run: |
          VITE_TARGET=app npx vite build
          mkdir -p $RUNNER_TEMP/empty-specs && cd $RUNNER_TEMP/empty-specs && git init -q && git -c user.email=ci@osoree -c user.name=ci commit -q --allow-empty -m empty && cd -
          export PODS_SOURCE="file://$RUNNER_TEMP/empty-specs"
          npx cap sync ios
      - name: Compile for the iPhone simulator (no Apple account needed)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -40
          ls build/Build/Products/Debug-iphonesimulator/
      - name: Open it in a simulator and take pictures
        run: |
          DEV=$(xcrun simctl list devices available | grep -m1 -E "iPhone [0-9]+ \(" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Simulator $DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEV" com.osoree.plus
          sleep 25
          mkdir -p shots
          xcrun simctl io "$DEV" screenshot shots/1-start.png
          xcrun simctl spawn "$DEV" log show --last 2m --predicate 'process == "App"' --style compact 2>/dev/null | grep -iE "error|⚡️|capacitor|ScreenPlugin" | tail -60 > shots/log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-simulator
          path: |
            shots/
            build/Build/Products/Debug-iphonesimulator/App.app

  # Once the Apple Developer account exists: signs (Xcode creates the certificate and profile itself through the
  # App Store Connect API key) and uploads to TestFlight. Skipped until the three secrets are set.
  testflight:
    needs: simulator
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15-intel
    env:
      HAS_KEY: ${{ secrets.ASC_KEY_P8 != '' }}
    steps:
      - name: App Store key present?
        if: env.HAS_KEY != 'true'
        run: echo "::notice::App Store Connect key not set yet — skipping TestFlight."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Build, sign and upload to TestFlight
        if: env.HAS_KEY == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm ci
          VITE_TARGET=app npx vite build
          mkdir -p $RUNNER_TEMP/empty-specs && cd $RUNNER_TEMP/empty-specs && git init -q && git -c user.email=ci@osoree -c user.name=ci commit -q --allow-empty -m empty && cd -
          PODS_SOURCE="file://$RUNNER_TEMP/empty-specs" npx cap sync ios
          mkdir -p ~/private_keys && echo "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          V=$(node -p "require('./package.json').version")
          AUTH="-authenticationKeyPath $HOME/private_keys/AuthKey_$ASC_KEY_ID.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive -allowProvisioningUpdates $AUTH \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID CODE_SIGN_STYLE=Automatic MARKETING_VERSION=$V CURRENT_PROJECT_VERSION=${{ github.run_number }} archive | tail -20
          cat > build/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist build/export.plist -exportPath build/export -allowProvisioningUpdates $AUTH | tail -20
