name: Mac probe
on:
  push:
    branches: [ios-dev]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: sw_vers && xcodebuild -version && xcrun simctl list devices available | grep -m3 iPhone
