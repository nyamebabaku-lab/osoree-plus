<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ɔsɔreɛ Plus Payment</title>
<style>
  :root { --bg: #ffffff; --fg: #1c1917; --muted: #57534e; --gold: #a16207; --btn: #16a34a; --btnfg: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e0f13; --fg: #f5f5f4; --muted: #a8a29e; --gold: #e2b232; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  main { max-width: 440px; margin: 0 auto; padding: 56px 20px; text-align: center; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; }
  h1 span { color: var(--gold); }
  p { color: var(--muted); margin: 10px 0; }
  a.btn { display: block; margin: 28px 0 12px; padding: 16px; border-radius: 14px; background: var(--btn); color: var(--btnfg); font-weight: 700; text-decoration: none; font-size: 1.05rem; }
  .ref { font-size: .8rem; }
</style>
</head>
<body>
<main>
  <h1>Ɔsɔreɛ <span>Plus</span></h1>
  <p id="msg">Thank you. Going back to the app…</p>
  <a class="btn" id="open" href="#">Open Ɔsɔreɛ Plus</a>
  <p>Pro (or your store item) switches on by itself a few seconds after the payment is confirmed.</p>
  <p class="ref" id="ref"></p>
</main>
<script>
  // Paystack sends the customer here after paying (?ref=… is ours, &reference=… is Paystack's).
  var q = new URLSearchParams(location.search);
  var ref = (q.get('ref') || q.get('reference') || '').replace(/[^A-Z0-9]/gi, '');
  if (ref) document.getElementById('ref').textContent = 'Payment reference: ' + ref;
  var android = /Android/i.test(navigator.userAgent);
  var open = document.getElementById('open');
  var stay = q.get('stay') === '1';
  if (android) {
    // Opens the installed app (com.osoree.plus, 1.11.2 or newer). If it cannot (older version), Chrome comes back
    // here with stay=1 instead of going to the Play Store, and the customer switches back to the app by hand.
    var back = location.origin + location.pathname + '?ref=' + ref + '&stay=1';
    var app = 'intent://paid?ref=' + ref + '#Intent;scheme=osoreeplus;package=com.osoree.plus;S.browser_fallback_url=' + encodeURIComponent(back) + ';end';
    open.href = app;
    if (stay) document.getElementById('msg').textContent = 'Thank you. Go back to Ɔsɔreɛ Plus now.';
    else setTimeout(function () { location.href = app; }, 300);
  } else {
    open.style.display = 'none';
    document.getElementById('msg').textContent = 'Thank you. Go back to Ɔsɔreɛ Plus now.';
  }
</script>
</body>
</html>
